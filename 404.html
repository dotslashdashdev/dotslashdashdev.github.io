<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="0; url=https://www.dotslashdash.com/">
    <title>dotslashdash</title>
    <script>
      // GitHub Pages는 없는 경로에 404.html을 내려준다. 같은 경로로 www에 넘겨서
      // https://dotslashdash.com/notice 같은 주소도 www.dotslashdash.com/notice 로 가게 한다.
      (function () {
        var l = window.location;
        var target = "https://www.dotslashdash.com" + l.pathname + l.search + l.hash;
        l.replace(target);
      })();
    </script>
    <style>
      body { margin: 0; font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #243CCA; background: #FAFBFC; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p>이동 중입니다… <a href="https://www.dotslashdash.com/">www.dotslashdash.com</a></p>
    </main>
  </body>
</html>
