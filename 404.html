<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="0; url=https://dotslashdash.com/">
    <title>dotslashdash</title>
    <script>
      // www가 GitHub Pages로 오면 www → 루트 리다이렉트가 생기므로, 없는 경로를 www로 보내면 무한 반복된다.
      // 그래서 www 전환 뒤에는 없는 경로를 루트(티저)로 보낸다.
      window.location.replace("https://dotslashdash.com/");
    </script>
    <style>
      body { margin: 0; font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #fff; background: #000; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p>이동 중입니다… <a href="https://dotslashdash.com/">dotslashdash.com</a></p>
    </main>
  </body>
</html>
