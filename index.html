<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.dotslashdash.com/">
    <meta http-equiv="refresh" content="0; url=https://www.dotslashdash.com/">
    <title>dotslashdash</title>
    <script>
      // 루트 도메인(dotslashdash.com)은 www로 넘긴다. 경로 · 쿼리 · 해시를 그대로 보존한다.
      // 예: https://dotslashdash.com/notice → https://www.dotslashdash.com/notice
      (function () {
        var l = window.location;
        var target = "https://www.dotslashdash.com" + l.pathname + l.search + l.hash;
        l.replace(target);
      })();
    </script>
    <style>
      body { margin: 0; font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #243CCA; background: #FAFBFC; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p>이동 중입니다… <a href="https://www.dotslashdash.com/">www.dotslashdash.com</a></p>
    </main>
  </body>
</html>
